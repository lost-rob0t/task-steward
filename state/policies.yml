version: 3

scope:
  exclusive_consumer: task-steward
  external_repo_mutation: forbidden
  managed_project_code_in_this_repo: forbidden
  issue_source_of_truth: owning-repository

context:
  personal_context_required_before_action: true
  resolve_ambiguity_from_memory_and_repository_state: true
  current_prompt_is_not_complete_context: true

backlog:
  complete_enumeration_required_before_no_work_claim: true
  include_open_prs: true
  include_open_issues: true
  include_unfinished_transactions: true
  include_failed_or_pending_ci: true
  prefer_valid_existing_backlog: true
  blocked_work_fallback: backlog_hygiene
  partial_sweep_must_not_be_reported_as_complete: true

reporting_house_style:
  applies_to:
    - auto-dig
    - research-reporting
    - discord-reporting
  tone:
    - clipped
    - cynical
    - punchy
    - minimal-ai-slop
  evidence_discipline_required: true
  never_invent:
    - crimes
    - motives
    - quotes
    - certainty

scheduling:
  authority: prolog
  expert_mode: serial
  llm_may_directly_schedule: false
  llm_may_directly_score_priority: false
  llm_may_directly_approve_handoff: false
  llm_may_directly_skip_required_gate: false

protected_projects:
  - hourly-auto-dig
  - starintel-discord-reports
  - prolog-rlm

wake:
  empty_commit_allowed: true
  meaning: reevaluate-only
  self_generated_state_commits_must_not_recurse: true

skip_policy:
  required_merge_gates_skippable: false
  skipped_jobs_require_reason: true
  skipped_tests_require_reason: true

self_rage:
  enabled: true
  pre_deployment_mode: mandatory_after_task_reconciliation
  pre_deployment_wait_for_empty_queue: false
  deployment_gate: expert_system_fully_deployed
  post_deployment_mode: fallback_when_no_schedulable_work
  changes_require_issue: true
  changes_require_regression_validation: true

expert_system_deployment:
  state: building
  requires:
    - yaml_state
    - yaml_to_prolog_compiler
    - validated_inline_prolog
    - durable_kb
    - serial_prolog_moe
    - unified_steward_interface
    - priority_scoring
    - dependency_and_eligibility_reasoning
    - failure_detection_and_retry_classification
    - regression_detection
    - job_and_test_skip_reasoning
    - non_skippable_required_gates
    - fenced_leases
    - structured_handoffs
    - decision_receipts
    - actions_wake_and_reconcile
    - recursive_wake_protection
    - scenario_regression_tests
    - external_repo_write_isolation
    - green_required_ci
    - no_p0_p1_deployment_blockers
