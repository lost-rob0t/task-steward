    priority:
      base: 100
      protected: true
    completion:
      gate: production-ready

  - id: chatgpt-books-book1
    repo: lost-rob0t/chatgpt-books
    status: paused
    mode: research
    priority:
      base: 60

  - id: task-stward-rage
    repo: mara/task-steward
    status: active
    mode: deployed-scheduling-self-rage-fallback
    automation_id: 6a54903dc26081918683fbdbc2c6c7cd
    self_coding_allowed: true
    priority:
      base: 10

  - id: hackmode
    repo: nsaspy/hackmode
    status: active
    mode: rage
    priority:
      base: 95
    workers:
      - hackmode-reviewer
      - hackmode-rage
    worktree_policy: one-git-worktree-per-issue-or-pr
    note: >
      hackmode is an interactive lisp-centric exploit framework plus recon
      pipeline (hackmode-scripts + emacs-hackmode + starintel-server).
      Reviewer worker runs twice daily; RAGE worker implements issues/PRs,
      auto-merges its own work, and must not leave open issues unresolved.

  - id: symbolics
    repo: nsaspy/a0-symbolics
    status: active
    mode: rage
    priority:
      base: 95
    workers:
      - symbolics-reviewer
      - symbolics-rage
    worktree_policy: one-git-worktree-per-issue-or-pr
    note: >
      a0-symbolics is Agent Zero with a durable Prolog verification layer
      (.prolog facts.kb + verify.pl, prolog-verify gates). Reviewer runs twice
      daily; RAGE worker implements issues/PRs in dedicated worktrees with
      prolog-verify + pytest gates before any merge.

  - id: skills
    repo: nsaspy/skills
    status: active
    mode: registry-sync
    priority:
      base: 50
    workers:
      - task-steward-gate
    note: >
      nsaspy/skills is the declarative skill registry. Installed into
      /a0/usr/skills by the container home-manager flake input
      (a0SkillSync activation, mirrors dotfiles skill-sync). No RAGE
      implementation loop; reviewer/gate keeps it in sync.
