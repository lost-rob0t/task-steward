      base: 100
      protected: true

  - id: starintel-discord-reports
    repo: lost-rob0t/starintel-discord-reporting
    status: active
    mode: permanent-worker
    priority:
      base: 100
      protected: true

  - id: zara
    repo: lost-rob0t/zara
    status: active
    mode: rage
    automation_id: 6a892ef4c180819189cba1afee1a4504
    priority:
      base: 95
      protected: true

  - id: local-recall
    repo: lost-rob0t/local-recall
    status: hard-paused-user
    mode: paused
    automation_id: 6a8934a82ef881919ab153b6aec87c15
    resume_requires: explicit-user-authorization
    priority:
      base: 95
      protected: true

  - id: prolog-rlm
    repo: nsaspy/prolog-rlm
    status: active
    mode: rage
    resume_requires: explicit-user-authorization
    resumed_by: explicit-user-authorization-2026-09-05
    workers:
      - prologrlm-reviewer
      - prologrlm-rage
    worktree_policy: one-git-worktree-per-issue-or-pr
    priority:
      base: 95
      protected: true
    completion:
      gate: production-ready
    rules:
      allowed_predicates:
        - install_verified/1
        - full_suite_green/1
        - e2e_verified/1
        - persistence_recovery_verified/1
        - bounded_failure_verified/1
        - p0_blocker/1
        - p1_blocker/1
      prolog: |
        production_ready(prolog_rlm) :-
            install_verified(prolog_rlm),
            full_suite_green(prolog_rlm),
            e2e_verified(prolog_rlm),
            persistence_recovery_verified(prolog_rlm),
            bounded_failure_verified(prolog_rlm),
            \+ p0_blocker(prolog_rlm),
            \+ p1_blocker(prolog_rlm).
    experts:
      - name: prolog-rlm-readiness
        stage: completion
        order: 1
        depends_on:
          - completion

  - id: starintel-infra
    repo: starintel-labs/starintel-infra
    status: paused-user
    mode: paused
    resume_requires: explicit-user-authorization
    priority:
      base: 90
    completion:
      gate: automated-deployment-ready

  - id: starintel-server
    repo: lost-rob0t/starintel-server
    status: active
