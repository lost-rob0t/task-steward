name: Task Steward RAGE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox python3-yaml

      - name: Validate YAML state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path("state").glob("*.yml")):
              with path.open("r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"validated {path}")
          PY

      - name: Validate Prolog KB and experts
        run: |
          swipl -q -s steward.pl -g "steward_validate,steward_status(S),writeln(S),halt"

      - name: Show deterministic next action
        run: |
          swipl -q -s steward.pl -g "steward_next(A),writeln(A),halt"
