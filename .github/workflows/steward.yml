name: Task Steward RAGE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox python3-yaml

      - name: Validate workflow scope and wake bounds
        run: |
          python3 scripts/validate_workflow_scope.py

      - name: Classify steward evaluation trigger
        id: wake
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          message="$(git log -1 --pretty=%B)"
          python3 scripts/classify_wake.py --event "$EVENT_NAME" --message "$message" >> "$GITHUB_OUTPUT"

      - name: Validate YAML state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path("state").glob("*.yml")):
              with path.open("r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"validated {path}")
          PY

      - name: Verify deterministic YAML to Prolog compilation
        run: |
          python3 -m py_compile scripts/compile_state.py scripts/compile_policies.py scripts/compile_automations.py scripts/compile_tasks.py scripts/compile_deployment.py scripts/compile_managed_github.py scripts/classify_wake.py scripts/reconcile_issue_task.py scripts/reconcile_issue_snapshot.py scripts/reconcile_managed_github.py
          python3 scripts/compile_state.py --check
          python3 scripts/compile_policies.py --check
          python3 scripts/compile_automations.py --check
          python3 scripts/compile_tasks.py --check
          python3 scripts/compile_deployment.py --check
          python3 scripts/compile_managed_github.py --check

      - name: Run compiler regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Prolog scenarios
        run: |
          swipl -q -s tests/leases.pl -g run_tests -t halt
          swipl -q -s tests/decision_receipts.pl -g run_tests -t halt
          swipl -q -s tests/failure_signatures.pl -g run_tests -t halt
          swipl -q -s tests/regressions.pl -g run_tests -t halt
          swipl -q -s tests/expert_pipeline.pl -g run_tests -t halt
          swipl -q -s tests/scheduling_modes.pl -g run_tests -t halt
          swipl -q -s tests/core_decisions.pl -g run_tests -t halt
          swipl -q -s tests/action_explanations.pl -g run_tests -t halt
          swipl -q -s tests/freeze_eligibility.pl -g run_tests -t halt
          swipl -q -s tests/deployment_gate.pl -g run_tests -t halt
          swipl -q -s tests/managed_github_scheduling.pl -g run_tests -t halt

      - name: Validate generated custom Prolog syntax
        run: |
          swipl -q -s experts/generated/project_rules.pl -g halt
          swipl -q -s kb/generated/managed_github.pl -g halt

      - name: Validate Prolog KB and experts
        run: |
          swipl -q -s steward.pl -g "steward_validate,steward_status(S),writeln(S),halt"

      - name: Evaluate deterministic expert pipeline
        run: |
          swipl -q -s steward.pl -g "steward_evaluate(E),writeln(E),halt"

      - name: Evaluate deterministic next action
        if: steps.wake.outputs.evaluate == 'true'
        run: |
          swipl -q -s steward.pl -g "steward_next(A),writeln(A),halt"
